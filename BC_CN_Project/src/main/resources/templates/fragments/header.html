<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header" class="site-header border-bottom sticky-top bg-white">
	<div class="container py-3">
		<nav class="navbar navbar-expand-lg gnb-menu p-0">
			<div class="container-fluid p-0">
				<a class="navbar-brand fw-bold text-primary fs-3 d-flex align-items-center gap-2 py-0" th:href="@{/}">
					<img th:src="@{/images/logo-youth.webp}" alt="청년자립도전사업단 로고"
						class="brand-logo-youth d-inline-block align-text-top">
					<span>청년자립도전사업단</span>
				</a>

				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#gnbNavbar"
					aria-controls="gnbNavbar" aria-expanded="false" aria-label="메뉴 열기">
					<span class="navbar-toggler-icon"></span>
				</button>

				<div class="collapse navbar-collapse justify-content-end" id="gnbNavbar">
					<ul class="navbar-nav gap-lg-4 pt-3 pt-lg-0">
						<li class="nav-item">
							<a class="nav-link fw-semibold" th:classappend="${currentMenu == 'about'} ? 'active'"
								th:href="@{/about}">사업단 소개</a>
						</li>
						<li class="nav-item">
							<a class="nav-link fw-semibold" th:classappend="${currentMenu == 'roastery'} ? 'active'"
								th:href="@{/roastery}">로스터리 사업장</a>
						</li>
						<li class="nav-item">
							<a class="nav-link fw-semibold" th:classappend="${currentMenu == 'roasting-lab'} ? 'active'"
								th:href="@{/roasting-lab}">로스팅랩 사업장</a>
						</li>
						<li class="nav-item">
							<a class="nav-link fw-semibold" th:classappend="${currentMenu == 'awards'} ? 'active'"
								th:href="@{/awards}">자립지원 우수사례</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>
	</div>
</header>

</html>
